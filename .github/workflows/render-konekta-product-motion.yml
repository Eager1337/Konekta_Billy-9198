name: Render Konekta 45-second product film

on:
  workflow_dispatch:
  push:
    branches:
      - konekta-launch
    paths:
      - "marketing/konekta-product-motion/**"
      - ".github/workflows/render-konekta-product-motion.yml"

permissions:
  contents: read

concurrency:
  group: konekta-product-motion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: marketing/konekta-product-motion/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: marketing/konekta-product-motion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Render 45-second video
        working-directory: marketing/konekta-product-motion
        run: python render-45.py

      - name: Verify rendered MP4
        working-directory: marketing/konekta-product-motion
        run: |
          test -s output/konekta-product-motion-45sec.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/konekta-product-motion-45sec.mp4
          ffmpeg -v error -i output/konekta-product-motion-45sec.mp4 -f null -

      - name: Upload finished video and previews
        uses: actions/upload-artifact@v4
        with:
          name: konekta-product-motion-45sec
          path: |
            marketing/konekta-product-motion/output/konekta-product-motion-45sec.mp4
            marketing/konekta-product-motion/output/konekta-45-cover.png
            marketing/konekta-product-motion/output/45-contact-sheet.jpg
            marketing/konekta-product-motion/output/audio-45-edit.json
          if-no-files-found: error
          retention-days: 30
